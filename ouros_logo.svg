  <!-- Snake body segments — small filled circles along the ring path -->
  <!-- 30 small dots at evenly spaced angles, fading from tail to head -->
  <!-- angles from 260° (tail) going clockwise to 220° (head, just before the gap for the mouth) -->
  <!-- We'll use transform rotate around center 340,185 -->

  <!-- Tail-to-head gradient colors: from faint to vivid blue -->
  <!-- Dots placed at r=112 from center -->
  <!-- 28 body segments, every 12 degrees from 250 to -82 (clockwise = increasing angle in SVG) -->

  <!-- Body dots — computed positions on circle r=112, center 340,185 -->
  <!-- angle in degrees, x = 340 + 112*cos(a), y = 185 + 112*sin(a) -->

